# Active roster: sources below use public career-site endpoints that the
# pipeline can commission with --roster-check before touching the database.
# Every active company is target-cycle 2027 and US-only for alerts/Tavily.
companies:
  - name: NVIDIA
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    search_text: intern
    target_year: 2027
    us_only: true

  - name: Qualcomm
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: eightfold
    board_url: https://careers.qualcomm.com/careers
    domain: qualcomm.com
    query: intern
    max_pages: 20
    target_year: 2027
    us_only: true

  - name: Intel
