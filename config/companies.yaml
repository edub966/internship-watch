    target_year: 2027
    us_only: true

  # Amazon's source adapter queries the public Amazon Jobs JSON search with a
  # hard country=USA scope before the normal downstream location guard.
  - name: Amazon
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: amazon
    query: intern
    country: USA
    result_limit: 100
    max_pages: 20
    page_delay: 0.10
    target_year: 2027
    us_only: true

  # Apple's source adapter bootstraps the public jobs.apple.com CSRF session and
  # searches only the official USA location facet.
  - name: Apple
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: apple
    query: intern
    locale: en-us
    location_filter: postLocation-USA
    # Apple API encodes Students: Internships as team/subteam STDNT/INTRN;
    # the adapter expands these to teamsAndSubTeams-STDNT / subTeam-INTRN.
    # Source-side filtering avoids scanning 1,000+ unrelated US roles.
    team: STDNT
    sub_team: INTRN
    max_pages: 30
    target_year: 2027
    us_only: true

  # Google exposes a stable public jobs callback payload that the commissioned
  # adapter can process without a browser. This is now in the active roster.
  - name: Google
    enabled: true
    company_tier: A
    priority_sectors: [swe, data_ml, hardware]
    type: google
    query: intern
    url: https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&hl=en&jlo=en
    target_year: 2027
    us_only: true

  # Large Greenhouse boards are fetched in compact mode first; only titles
  # matching these opportunity terms incur a detail request.
  - name: Cloudflare
    enabled: true
    company_tier: B
    priority_sectors: [swe, data_ml]
    type: greenhouse
    board_token: cloudflare
    title_terms: [intern, internship, co-op, coop, student]
    max_detail_resolutions: 100
    target_year: 2027
    us_only: true

