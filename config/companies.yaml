  - name: Silicon Labs
    enabled: true
    company_tier: B
    priority_sectors: [hardware, swe]
    type: workday
    host: silabs.wd1.myworkdayjobs.com
    tenant: silabs
    site: SiliconLabsCareers
    search_text: intern
    target_year: 2027
    us_only: true

  - name: Microsoft
    enabled: true
    company_tier: A
    priority_sectors: [swe, data_ml, hardware]
    type: eightfold
    board_url: https://apply.careers.microsoft.com/careers
    domain: microsoft.com
    query: intern
    max_pages: 40
    target_year: 2027
    us_only: true

  # Amazon's source adapter queries the public Amazon Jobs JSON search with a
  # hard country=USA scope before the normal downstream location guard.
  - name: Amazon
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: amazon
    query: intern
    country: USA
    result_limit: 100
    max_pages: 20
    page_delay: 0.10
    target_year: 2027
    us_only: true

  # Apple's source adapter bootstraps the public jobs.apple.com CSRF session and
  # searches only the official USA location facet.
  - name: Apple
    enabled: true
    company_tier: A
    priority_sectors: [hardware, swe, data_ml]
    type: apple
    query: intern
    locale: en-us
    location_filter: postLocation-USA
    # Apple API encodes Students: Internships as team/subteam STDNT/INTRN;
    # the adapter expands these to teamsAndSubTeams-STDNT / subTeam-INTRN.
    # Source-side filtering avoids scanning 1,000+ unrelated US roles.
    team: STDNT
    sub_team: INTRN
    max_pages: 30
    target_year: 2027
    us_only: true

  # Google exposes a stable public jobs callback payload that the commissioned
  # adapter can process without a browser. This is now in the active roster.
  - name: Google
    enabled: true
    company_tier: A
    priority_sectors: [swe, data_ml, hardware]
    type: google
    query: intern
    url: https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&hl=en&jlo=en
    target_year: 2027
    us_only: true

  # Large Greenhouse boards are fetched in compact mode first; only titles
  # matching these opportunity terms incur a detail request.
  - name: Cloudflare
    enabled: true
    company_tier: B
    priority_sectors: [swe, data_ml]
    type: greenhouse
    board_token: cloudflare
    title_terms: [intern, internship, co-op, coop, student]
    max_detail_resolutions: 100
    target_year: 2027
    us_only: true

  - name: Datadog
    enabled: true
    company_tier: B
    priority_sectors: [swe, data_ml]
    type: greenhouse
    board_token: datadog
    title_terms: [intern, internship, co-op, coop, student]
    max_detail_resolutions: 100
    target_year: 2027
    us_only: true

  - name: MongoDB
    enabled: true
    company_tier: B
    priority_sectors: [swe, data_ml]
    type: greenhouse
    board_token: mongodb
    title_terms: [intern, internship, co-op, coop, student]
    max_detail_resolutions: 100
    target_year: 2027
    us_only: true

  # SmartRecruiters' documented q filter is not reliable on every tenant, so
  # the shared adapter pages the US board and filters internship titles locally
  # before resolving descriptions.
  - name: ServiceNow
    enabled: true
    company_tier: B
    priority_sectors: [swe, data_ml]
    type: smartrecruiters
    identifier: ServiceNow
    query: intern
    country: us
    title_terms: [intern, internship, co-op, coop, student]
    page_size: 100
    max_pages: 5
    target_year: 2027
    us_only: true

  - name: Bosch
    enabled: true
    company_tier: C
    priority_sectors: [hardware, swe, data_ml]
    type: smartrecruiters
    identifier: BoschGroup
    query: intern
    country: us
    title_terms: [intern, internship, co-op, coop, student]
    page_size: 100
    max_pages: 5
    target_year: 2027
    us_only: true

# These are desirable CE targets, but we intentionally do NOT enable them until
# a stable, testable public career-source adapter is commissioned. Keeping them
# staged is safer than pretending a brittle scraper is production-ready.
staged_companies:
  - name: AMD
    company_tier: A
    reason: Current Phenom careers site needs a dedicated stable adapter before activation.
  - name: Arm
    company_tier: A
    reason: Current careers search needs a dedicated validated adapter before activation.
  - name: Meta
    company_tier: A
    reason: Careers search is GraphQL/persisted-query based and requires a robust dedicated adapter.
  - name: Synopsys
    company_tier: B
    reason: Current careers flow needs a dedicated validated adapter before activation.
  - name: Texas Instruments
    company_tier: B
    reason: Add after its current ATS endpoint is verified and unit-tested.
  - name: Tesla
    company_tier: A
    reason: Add after its current ATS endpoint is verified and unit-tested.
  - name: SpaceX
    company_tier: A
    reason: Add after its current ATS endpoint is verified and unit-tested.
  - name: Visa
    company_tier: C
    reason: Its historical SmartRecruiters tenant currently reports zero active postings, so enabling it would provide no useful health signal.
